apiVersion: v1
kind: Namespace
metadata: {name: vton-web}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vtonweb-config, namespace: vton-web}
data:
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
  VTON_API_URL: "http://vton-api.vton.svc.cluster.local:8000"
  VTON_STEPS: "30"
  MAX_ACTIVE_JOBS_PER_USER: "3"
  POSTGRES_HOST: "postgres"
  POSTGRES_DB: "vtonweb"
  POSTGRES_USER: "vtonweb"
  MEDIA_ROOT: "/data/media"
  TIME_ZONE: "America/El_Salvador"
