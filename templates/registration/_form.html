{% for field in form %}
<div class="mb-3">
 <label class="form-label fw-medium" for="{{ field.id_for_label }}">{{ field.label }}</label>
 {{ field }}
 {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
 {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
{% for e in form.non_field_errors %}<div class="alert alert-danger">{{ e }}</div>{% endfor %}
<script>document.querySelectorAll('form input:not([type=checkbox]):not([type=file]):not([type=hidden]),form select').forEach(e=>e.classList.add('form-control'));</script>
